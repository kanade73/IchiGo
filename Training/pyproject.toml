[project]
name = "ichigo-train"
version = "0.1.0"
description = "IchiGo logic-gate network training (PyTorch)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ichigo_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
